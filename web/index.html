<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股短线模拟盘 · 实时战绩</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--green:#3fb950;--red:#f85149;--txt:#e6edf3;--dim:#8b949e;--gold:#d29922;--blue:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.card .label{color:var(--dim);font-size:12px}
.card .value{font-size:22px;font-weight:700;margin-top:2px}
.card .value.big{font-size:28px}
.up{color:var(--red)}.down{color:var(--green)}
.pos{color:var(--red)}.neg{color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #21262d;vertical-align:top}
h2{font-size:15px;margin:18px 0 8px;color:var(--gold);display:flex;align-items:center;gap:7px}
h2 .ico{font-size:16px;line-height:1;width:18px;text-align:center;flex:none}
h2 .cnt{font-size:12px;color:var(--dim);font-weight:400}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid var(--border);white-space:nowrap}
.badge.buy,.badge.LLM_BUY{color:var(--red);border-color:var(--red)}
.badge.sell,.badge.LLM_SELL,.badge.RISK_SELL,.badge.FINAL_SELL{color:var(--green);border-color:var(--green)}
.badge.SUMMARY{color:var(--gold);border-color:var(--gold)}
.badge.REGIME{color:var(--blue);border-color:var(--blue)}
.badge.THINKING{color:#a371f7;border-color:#a371f7}
.badge.HOLD,.badge.EVENT{color:var(--dim)}
.reason{color:var(--dim);font-size:12px;max-width:420px}
.spark{display:flex;align-items:flex-end;gap:2px;height:40px;margin-bottom:8px}
.spark:empty{display:none}
.spark i{flex:1;background:var(--gold);border-radius:1px;min-height:2px;cursor:default}
.btn{background:#21262d;border:1px solid var(--border);color:var(--txt);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--gold)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
.status-dot.off{background:var(--dim)}
.small{font-size:12px;color:var(--dim)}
.report-md{font-size:13px;line-height:1.8}
.report-md h1{font-size:16px;color:var(--gold);margin:4px 0 8px}
.report-md h2{font-size:13px;color:var(--dim);margin:14px 0 4px;display:block}
.report-md table{margin:6px 0}
.tabbtn{background:#21262d;border:1px solid var(--border);color:var(--dim);padding:3px 12px;border-radius:14px;cursor:pointer;font-size:12px}
.tabbtn.active{color:var(--gold);border-color:var(--gold)}
.tabbtn:hover{border-color:var(--gold)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.pager button{background:#21262d;border:1px solid var(--border);color:var(--txt);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager button:not(:disabled):hover{border-color:var(--gold);color:var(--gold)}
.pager select{background:#21262d;border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:2px 4px;font-size:12px}
.pager .pg{min-width:74px;text-align:center}
</style>
</head>
<body>
<h1>📈 A股短线模拟盘 <span id="dot" class="status-dot"></span><span class="small" id="stext"></span></h1>
<div class="sub">真实行情 · LLM决策 · 本金 <span id="principal"></span> · 实验期 <span id="period"></span> · <span id="bjtime"></span> <button class="btn" onclick="forceDecide()" style="margin-left:10px">手动决策</button></div>

<div class="grid" id="cards"></div>

<h2><span class="ico">💼</span>当前持仓<span class="cnt" id="posCount"></span></h2>
<div class="card"><table id="posTbl"><thead><tr><th>股票</th><th>数量</th><th>成本</th><th>现价</th><th>今日</th><th>盈亏</th><th>盈亏%</th><th>止损线</th><th>买入理由</th></tr></thead><tbody></tbody></table></div>

<h2><span class="ico">📊</span>每日战报</h2>
<div class="card">
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px" id="reportTabs"></div>
<div id="reportBody" class="report-md"></div>
</div>

<h2><span class="ico">📈</span>每日净值</h2>
<div class="card"><div id="equityChart" class="spark"></div><table id="dailyTbl"><thead><tr><th>日期</th><th>净值</th><th>收益率</th><th>现金</th><th>持仓</th></tr></thead><tbody></tbody></table></div>

<h2><span class="ico">🧾</span>交易流水<span class="cnt" id="tradeCount"></span></h2>
<div class="card"><table id="tradeTbl"><thead><tr><th>时间</th><th>方向</th><th>股票</th><th>价格</th><th>数量</th><th>金额</th><th>费用</th><th>盈亏</th><th>理由</th></tr></thead><tbody></tbody></table></div>

<h2><span class="ico">🧠</span>经验库<span class="cnt" id="lessonCounts"></span></h2>
<div class="card">
<div id="reflect" class="small" style="margin-bottom:6px"></div>
<div id="lastAudit" class="small" style="margin-bottom:8px"></div>
<table id="lessonTbl"><thead><tr><th style="width:96px">ID</th><th style="width:70px">状态</th><th>经验内容</th><th style="width:52px">引用</th><th style="width:88px">战绩(胜/了结)</th><th style="width:70px">净盈亏</th></tr></thead><tbody></tbody></table>
<div class="pager"><span class="small">状态流转：candidate试用 →(战绩达标/审计通过)→ active启用 →(战绩证伪/过时/冗余)→ retired淘汰 ｜ 收盘自动三段治理：教练生成→程序硬规则→独立审计官裁决</span></div>
</div>

<h2><span class="ico">🕐</span>决策 / 事件日志<span class="cnt" id="decCount"></span></h2>
<div class="card">
<table id="decTbl"><thead><tr><th style="width:130px">时间</th><th style="width:96px">类型</th><th>内容</th></tr></thead><tbody></tbody></table>
<div class="pager">
  <span>每页</span>
  <select id="decSize" onchange="decSizeChange(this.value)"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select>
  <span>条</span>
  <button id="decFirst" onclick="decGo(1)">« 首页</button>
  <button id="decPrev" onclick="decGo(decPage-1)">‹ 上一页</button>
  <span class="pg" id="decPg"></span>
  <button id="decNext" onclick="decGo(decPage+1)">下一页 ›</button>
  <button id="decLast" onclick="decGo(9999)">末页 »</button>
</div>
</div>

<script>
const TYPE_LABEL={LLM_BUY:'买入',LLM_SELL:'卖出',RISK_SELL:'风控卖出',FINAL_SELL:'到期清仓',HOLD:'持有',SUMMARY:'决策思路',REGIME:'大盘体制',THINKING:'模型思考',EVENT:'系统事件'};

async function refresh(){
 try{
  const d = await (await fetch('/api/state')).json();
  const base = d.cfg.startCash;
  const eq = d.equity, pl = eq-base, plp = pl/base*100;
  document.getElementById('principal').textContent = '¥'+base.toLocaleString();
  document.getElementById('period').textContent = d.cfg.runStart+' ~ '+d.cfg.runEnd;
  document.getElementById('bjtime').textContent = d.status.bjNow+' 北京时间';
  const dot=document.getElementById('dot');
  dot.className='status-dot'+(d.status.running&&!d.status.stopped?'':' off');
  document.getElementById('stext').textContent = d.status.experimentOver?'实验已结束':(d.status.inWindow?'盘中运行':'休市');
  const realized = d.trades.filter(t=>t.side==='SELL').reduce((a,t)=>a+(t.profit||0),0);
  const wins = d.trades.filter(t=>t.side==='SELL'&&t.profit>0).length;
  const sells = d.trades.filter(t=>t.side==='SELL').length;
  const fees = d.trades.reduce((a,t)=>a+(t.fee||0),0);
  const dd = d.status.drawdownPct;
  document.getElementById('cards').innerHTML = `
   <div class="card"><div class="label">💰 当前净值</div><div class="value big ${pl>=0?'pos':'neg'}">¥${eq.toFixed(2)}</div><div class="small ${pl>=0?'pos':'neg'}">${pl>=0?'+':''}${pl.toFixed(2)} (${plp>=0?'+':''}${plp.toFixed(2)}%)</div></div>
   <div class="card"><div class="label">🏦 现金</div><div class="value">¥${d.cash.toFixed(2)}</div><div class="small">回撤 ${dd!=null?(dd>=0?'+':'')+dd+'%':'-'}</div></div>
   <div class="card"><div class="label">✅ 已实现盈亏(已卖出)</div><div class="value ${realized>=0?'pos':'neg'}">¥${realized.toFixed(2)}</div></div>
   <div class="card"><div class="label">📊 浮动盈亏(持仓中)</div><div class="value ${(pl-realized)>=0?'pos':'neg'}">¥${(pl-realized).toFixed(2)}</div></div>
   <div class="card"><div class="label">🎯 交易 / 胜率</div><div class="value">${d.trades.length} / ${sells?(wins/sells*100).toFixed(0)+'%':'-'}</div></div>
   <div class="card"><div class="label">🧮 总费用</div><div class="value">¥${fees.toFixed(2)}</div></div>`;
  document.getElementById('posCount').textContent = d.positions.length?`(${d.positions.length}只)`:'(空仓)';
  const pb = document.querySelector('#posTbl tbody');
  pb.innerHTML = d.positions.length ? d.positions.map(p=>`<tr><td><b>${p.name}</b><br><span class="small">${p.code}</span></td><td>${p.shares}</td><td>${p.costPrice.toFixed(2)}</td><td>${p.price.toFixed(2)}</td><td class="${p.dayPct>=0?'up':'down'}">${p.dayPct!=null?(p.dayPct>=0?'+':'')+p.dayPct.toFixed(2)+'%':'-'}</td><td class="${p.pnl>=0?'pos':'neg'}">${p.pnl>=0?'+':''}${p.pnl.toFixed(2)}</td><td class="${p.pnlPct>=0?'pos':'neg'}">${p.pnlPct>=0?'+':''}${p.pnlPct.toFixed(2)}%</td><td class="small">${p.stopPrice?p.stopPrice:'<span class="small">待计算</span>'}</td><td class="reason">${p.reason||''}</td></tr>`).join('') : '<tr><td colspan="9" class="small">空仓</td></tr>';
  const db = document.querySelector('#dailyTbl tbody');
  db.innerHTML = d.daily.length ? d.daily.map(x=>`<tr><td>${x.date}</td><td>¥${x.equity.toFixed(2)}</td><td class="${x.totalPct>=0?'pos':'neg'}">${x.totalPct>=0?'+':''}${x.totalPct}%</td><td>${x.cash.toFixed(0)}</td><td class="small">${x.positions}</td></tr>`).join('') : '<tr><td colspan="5" class="small">尚无收盘记录</td></tr>';
  // 净值走势：≥2天才画曲线；空容器由CSS :empty隐藏，不占高度
  document.getElementById('equityChart').innerHTML = d.daily.length>=2
   ? (()=>{ const vals=d.daily.map(x=>x.equity); const mn=Math.min(...vals,base),mx=Math.max(...vals,base);
       return vals.map((v,i)=>`<i title="${d.daily[i].date}: ¥${v.toFixed(0)} (${d.daily[i].totalPct}%)" style="height:${mx>mn?((v-mn)/(mx-mn)*36+4):20}px;background:${v>=base?'var(--red)':'var(--green)'};max-width:26px"></i>`).join(''); })()
   : '';
  document.getElementById('tradeCount').textContent = `(共${d.trades.length}笔)`;
  const tb = document.querySelector('#tradeTbl tbody');
  tb.innerHTML = d.trades.length ? d.trades.slice().reverse().slice(0,50).map(t=>`<tr><td class="small">${t.ts}</td><td><span class="badge ${t.side==='BUY'?'buy':'sell'}">${t.side==='BUY'?'买入':'卖出'}</span></td><td><b>${t.name}</b><br><span class="small">${t.code}</span></td><td>${t.price}</td><td>${t.shares}</td><td>${t.amount}</td><td>${t.fee}</td><td class="${(t.profit||0)>=0?'pos':'neg'}">${t.profit!=null?(t.profit>=0?'+':'')+t.profit:'-'}</td><td class="reason">${t.reason||''}${t.sizing?'<br><span class="small">仓位: '+t.sizing+'</span>':''}</td></tr>`).join('') : '<tr><td colspan="9" class="small">尚无交易</td></tr>';
  loadLessons();
  buildDecRows(d);
 }catch(e){console.error(e)}
}

// ---------- 决策/事件日志：分页 ----------
let decRows=[], decPage=1, decPageSize=20;
function buildDecRows(d){
  const rows=[];
  for(const x of d.decisions||[]) rows.push({ts:x.ts,type:x.type,text:decText(x)});
  for(const x of d.events||[]) rows.push({ts:x.ts,type:'EVENT',text:x.msg});
  rows.sort((a,b)=>b.ts.localeCompare(a.ts));
  decRows=rows;
  document.getElementById('decCount').textContent=`(共${rows.length}条)`;
  renderDec();
}
function decText(x){
  const head=(x.name?x.name+(x.code?'('+x.code+')':'')+' ':'')+(x.price?'@'+x.price+' ':'')+(x.shares?x.shares+'股 ':'');
  let body=x.reason||x.summary||x.msg||x.detail||x.text||'';
  if(x.profit!=null) body=`盈亏¥${x.profit} `+body;
  if(x.sizing) body+=` ｜ 仓位: ${x.sizing}`;
  if(x.posPct) body+=` ｜ 占比: ${x.posPct}`;
  if(x.dd) body+=` ｜ 净值回撤: ${x.dd}`;
  if(x.guard&&x.guard!=='normal') body+=` ｜ ${x.guard}模式`;
  if(body.length>300) body=body.slice(0,300)+'…';
  return head+body;
}
function renderDec(){
  const total=decRows.length, pages=Math.max(1,Math.ceil(total/decPageSize));
  if(decPage>pages) decPage=pages;
  if(decPage<1) decPage=1;
  const start=(decPage-1)*decPageSize;
  const slice=decRows.slice(start,start+decPageSize);
  document.querySelector('#decTbl tbody').innerHTML = slice.length
    ? slice.map(r=>`<tr><td class="small">${r.ts}</td><td><span class="badge ${r.type}">${TYPE_LABEL[r.type]||r.type}</span></td><td class="reason" style="max-width:none">${r.text}</td></tr>`).join('')
    : '<tr><td colspan="3" class="small">尚无记录</td></tr>';
  document.getElementById('decPg').textContent=`第 ${decPage} / ${pages} 页`;
  document.getElementById('decFirst').disabled=decPage<=1;
  document.getElementById('decPrev').disabled=decPage<=1;
  document.getElementById('decNext').disabled=decPage>=pages;
  document.getElementById('decLast').disabled=decPage>=pages;
}
function decGo(p){ decPage=p; renderDec(); }
function decSizeChange(v){ decPageSize=parseInt(v)||20; decPage=1; renderDec(); }

async function forceDecide(){await fetch('/api/decide',{method:'POST'});setTimeout(refresh,3000)}

// ---------- 经验库治理视图 ----------
const ST_LABEL={active:['启用','var(--green)'],candidate:['试用','var(--gold)'],retired:['淘汰','var(--dim)']};
async function loadLessons(){
 try{
  const d=await(await fetch('/api/lessons')).json();
  document.getElementById('lessonCounts').textContent=`(启用${d.counts.active} · 试用${d.counts.candidate} · 淘汰${d.counts.retired})`;
  const rf=(d.reflections||[])[0];
  document.getElementById('reflect').innerHTML=rf?`最新复盘(${rf.date}): ${rf.summary}`:'';
  const la=d.lastAudit;
  document.getElementById('lastAudit').innerHTML=la?`🕵️ 最近审计(${la.date}): 复核${la.reviewed}条 ${la.summary||''}${la.acts&&la.acts.length?' ｜ '+la.acts.join('；'):''}`:'';
  const all=[...d.items.active,...d.items.candidate,...d.items.retired];
  const tb=document.querySelector('#lessonTbl tbody');
  tb.innerHTML=all.length?all.map(x=>{
    const st=ST_LABEL[x.status]||['?','var(--dim)'];
    const wr=x.trades?`<span class="${x.wins/x.trades>=0.5?'pos':'neg'}">${x.wins}/${x.trades}</span>`:'<span class="small">未了结</span>';
    const hist=(x.history||[]).length?`<br><span class="small">履历: ${x.history.slice(-2).map(h=>h.date.slice(5)+' '+h.act+(h.why?'('+h.why.slice(0,24)+')':'')).join(' → ')}</span>`:'';
    return `<tr${x.status==='retired'?' style="opacity:.45"':''}><td class="small">${x.id}</td><td><span style="color:${st[1]};border:1px solid ${st[1]};padding:0 6px;border-radius:8px;font-size:11px">${st[0]}</span></td><td class="reason" style="max-width:none;color:var(--txt)">${x.text}${hist}</td><td>${x.citations}</td><td>${wr}</td><td class="${x.netPnl>0?'pos':x.netPnl<0?'neg':'small'}">${x.netPnl?((x.netPnl>0?'+':'')+x.netPnl):'-'}</td></tr>`;
  }).join(''):'<tr><td colspan="6" class="small">尚无经验</td></tr>';
 }catch(e){console.error(e)}
}

let reports=[], activeReport=0;
function mdToHtml(md){
 return md
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/^# (.+)$/gm,'<h1>$1</h1>')
  .replace(/^## (.+)$/gm,'<h2>$1</h2>')
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/^- (.+)$/gm,'<div style="padding-left:10px">• $1</div>')
  .replace(/^  (.+)$/gm,'<div style="padding-left:26px;color:var(--dim);font-size:12px">$1</div>')
  .replace(/^\|(.+)\|$/gm,(m)=>{const c=m.split('|').slice(1,-1).map(x=>x.trim());
    if(c.every(x=>/^-{3,}$/.test(x))) return '<tr class="sep"></tr>';   // 整行都是---才是分隔行
    return '<tr>'+c.map(x=>`<td>${x==='-'?'<span class="small">-</span>':x}</td>`).join('')+'</tr>';})
  .replace(/(<tr>.*<\/tr>)(\n<tr[^>]*>.*<\/tr>)+/gs,(block)=>{
    const rows=block.split('\n');
    const head=rows[0].replace(/<tr>/,'<thead><tr>').replace(/<\/tr>/,'</tr></thead>');
    return '<table>'+head+rows.slice(2).join('')+'</table>';   // slice(2)跳过表头下的分隔行
  })
  .replace(/\n{2,}/g,'<br>').replace(/\n/g,'');
}
async function loadReports(){
 try{
  const d=await(await fetch('/api/reports?n=31')).json();
  reports=d.reports||[];
  const tabs=document.getElementById('reportTabs');
  tabs.innerHTML=reports.map((r,i)=>`<button class="tabbtn ${i===activeReport?'active':''}" onclick="showReport(${i})">${r.date.slice(5)} ${r.totalPct>=0?'<span class="up">':'<span class="down">'}${(r.totalPct>=0?'+':'')+r.totalPct}%</span></button>`).join('')||'<span class="small">尚无战报（收盘后自动生成）</span>';
  showReport(activeReport);
 }catch(e){console.error(e)}
}
function showReport(i){
 activeReport=Math.min(i,Math.max(0,reports.length-1));
 document.querySelectorAll('#reportTabs .tabbtn').forEach((b,j)=>b.className='tabbtn'+(j===activeReport?' active':''));
 const r=reports[activeReport];
 document.getElementById('reportBody').innerHTML=r?mdToHtml(r.md):'<span class="small">尚无战报（收盘后自动生成）</span>';
}
refresh(); setInterval(refresh, 30000);
loadReports(); setInterval(loadReports, 300000);
loadLessons(); setInterval(loadLessons, 120000);
</script>
</body>
</html>
