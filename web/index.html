<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股短线模拟盘 · 实时战绩</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--green:#3fb950;--red:#f85149;--txt:#e6edf3;--dim:#8b949e;--gold:#d29922}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.card .label{color:var(--dim);font-size:12px}
.card .value{font-size:22px;font-weight:700;margin-top:2px}
.card .value.big{font-size:28px}
.up{color:var(--red)}.down{color:var(--green)}
.pos{color:var(--red)}.neg{color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #21262d;vertical-align:top}
h2{font-size:15px;margin:18px 0 8px;color:var(--gold)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid var(--border)}
.badge.buy{color:var(--red);border-color:var(--red)}
.badge.sell{color:var(--green);border-color:var(--green)}
.reason{color:var(--dim);font-size:12px;max-width:420px}
.spark{display:flex;align-items:flex-end;gap:2px;height:40px;margin-top:6px}
.spark i{flex:1;background:var(--gold);border-radius:1px;min-height:2px}
.btn{background:#21262d;border:1px solid var(--border);color:var(--txt);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--gold)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}
.status-dot.off{background:var(--dim)}
.small{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<h1>📈 A股短线模拟盘 <span id="dot" class="status-dot"></span><span class="small" id="stext"></span></h1>
<div class="sub">真实行情 · LLM决策 · 本金 ¥10,000 · 实验期 <span id="period"></span> · <span id="bjtime"></span> <button class="btn" onclick="forceDecide()" style="margin-left:10px">手动决策</button></div>

<div class="grid" id="cards"></div>

<h2>当前持仓</h2>
<div class="card"><table id="posTbl"><thead><tr><th>股票</th><th>数量</th><th>成本</th><th>现价</th><th>今日</th><th>盈亏</th><th>盈亏%</th><th>买入理由</th></tr></thead><tbody></tbody></table></div>

<h2>每日净值</h2>
<div class="card"><div id="equityChart" class="spark"></div><table id="dailyTbl" style="margin-top:8px"><thead><tr><th>日期</th><th>净值</th><th>收益率</th><th>现金</th><th>持仓</th></tr></thead><tbody></tbody></table></div>

<h2>交易流水 <span class="small" id="tradeCount"></span></h2>
<div class="card"><table id="tradeTbl"><thead><tr><th>时间</th><th>方向</th><th>股票</th><th>价格</th><th>数量</th><th>金额</th><th>费用</th><th>盈亏</th><th>理由</th></tr></thead><tbody></tbody></table></div>

<h2>🧠 经验库（每日复盘进化）</h2>
<div class="card"><div id="reflect" class="small" style="margin-bottom:6px"></div><table id="lessonTbl"><tbody></tbody></table></div>

<h2>最近决策/事件</h2>
<div class="card"><table id="decTbl"><thead><tr><th>时间</th><th>类型</th><th>内容</th></tr></thead><tbody></tbody></table></div>

<script>
async function refresh(){
 try{
  const d = await (await fetch('/api/state')).json();
  const base = d.cfg.startCash;
  const eq = d.equity, pl = eq-base, plp = pl/base*100;
  document.getElementById('period').textContent = d.cfg.runStart+' ~ '+d.cfg.runEnd;
  document.getElementById('bjtime').textContent = d.status.bjNow+' 北京时间';
  const dot=document.getElementById('dot');
  dot.className='status-dot'+(d.status.running&&!d.status.stopped?'':' off');
  document.getElementById('stext').textContent = d.status.experimentOver?'实验已结束':(d.status.inWindow?'盘中运行':'休市');
  const realized = d.trades.filter(t=>t.side==='SELL').reduce((a,t)=>a+(t.profit||0),0);
  const wins = d.trades.filter(t=>t.side==='SELL'&&t.profit>0).length;
  const sells = d.trades.filter(t=>t.side==='SELL').length;
  const fees = d.trades.reduce((a,t)=>a+(t.fee||0),0);
  document.getElementById('cards').innerHTML = `
   <div class="card"><div class="label">当前净值</div><div class="value big ${pl>=0?'pos':'neg'}">¥${eq.toFixed(2)}</div><div class="small ${pl>=0?'pos':'neg'}">${pl>=0?'+':''}${pl.toFixed(2)} (${plp>=0?'+':''}${plp.toFixed(2)}%)</div></div>
   <div class="card"><div class="label">现金</div><div class="value">¥${d.cash.toFixed(2)}</div></div>
   <div class="card"><div class="label">已实现盈亏</div><div class="value ${realized>=0?'pos':'neg'}">¥${realized.toFixed(2)}</div></div>
   <div class="card"><div class="label">交易 / 胜率</div><div class="value">${d.trades.length} / ${sells?(wins/sells*100).toFixed(0)+'%':'-'}</div></div>
   <div class="card"><div class="label">总费用</div><div class="value">¥${fees.toFixed(2)}</div></div>`;
  const pb = document.querySelector('#posTbl tbody');
  pb.innerHTML = d.positions.length ? d.positions.map(p=>`<tr><td><b>${p.name}</b><br><span class="small">${p.code}</span></td><td>${p.shares}</td><td>${p.costPrice.toFixed(2)}</td><td>${p.price.toFixed(2)}</td><td class="${p.dayPct>=0?'up':'down'}">${p.dayPct!=null?(p.dayPct>=0?'+':'')+p.dayPct.toFixed(2)+'%':'-'}</td><td class="${p.pnl>=0?'pos':'neg'}">${p.pnl>=0?'+':''}${p.pnl.toFixed(2)}</td><td class="${p.pnlPct>=0?'pos':'neg'}">${p.pnlPct>=0?'+':''}${p.pnlPct.toFixed(2)}%</td><td class="reason">${p.reason||''}</td></tr>`).join('') : '<tr><td colspan="8" class="small">空仓</td></tr>';
  const db = document.querySelector('#dailyTbl tbody');
  db.innerHTML = d.daily.length ? d.daily.map(x=>`<tr><td>${x.date}</td><td>¥${x.equity.toFixed(2)}</td><td class="${x.totalPct>=0?'pos':'neg'}">${x.totalPct>=0?'+':''}${x.totalPct}%</td><td>${x.cash.toFixed(0)}</td><td class="small">${x.positions}</td></tr>`).join('') : '<tr><td colspan="5" class="small">尚无收盘记录</td></tr>';
  if(d.daily.length>1){
   const vals=d.daily.map(x=>x.equity); const mn=Math.min(...vals),mx=Math.max(...vals);
   document.getElementById('equityChart').innerHTML=vals.map(v=>`<i style="height:${mx>mn?((v-mn)/(mx-mn)*36+4):20}px;background:${v>=base?'var(--red)':'var(--green)'}"></i>`).join('');
  }
  document.getElementById('tradeCount').textContent = `(共${d.trades.length}笔)`;
  const tb = document.querySelector('#tradeTbl tbody');
  tb.innerHTML = d.trades.length ? d.trades.slice().reverse().slice(0,50).map(t=>`<tr><td class="small">${t.ts}</td><td><span class="badge ${t.side==='BUY'?'buy':'sell'}">${t.side==='BUY'?'买入':'卖出'}</span></td><td><b>${t.name}</b><br><span class="small">${t.code}</span></td><td>${t.price}</td><td>${t.shares}</td><td>${t.amount}</td><td>${t.fee}</td><td class="${(t.profit||0)>=0?'pos':'neg'}">${t.profit!=null?(t.profit>=0?'+':'')+t.profit:'-'}</td><td class="reason">${t.reason||''}</td></tr>`).join('') : '<tr><td colspan="9" class="small">尚无交易</td></tr>';
  const ls = d.lessons||{items:[],reflections:[]};
  const rf = (ls.reflections||[]).slice(-1)[0];
  document.getElementById('reflect').innerHTML = rf?`最新复盘(${rf.date}): ${rf.summary}`:'';
  document.querySelector('#lessonTbl tbody').innerHTML = (ls.items||[]).length ? ls.items.slice().reverse().map(x=>`<tr><td class="small" style="width:60px">${x.date.slice(5)}</td><td class="reason" style="max-width:none;color:var(--txt)">${x.text}</td></tr>`).join('') : '<tr><td class="small">尚无经验</td></tr>';
  const decb = document.querySelector('#decTbl tbody');
  const rows=[];
  for(const x of d.decisions.slice().reverse().slice(0,25)) rows.push({ts:x.ts,type:x.type,text:(x.name?x.name+'('+x.code+') ':'')+(x.price?'@'+x.price+' ':'')+(x.reason||x.summary||'')});
  for(const x of d.events.slice().reverse().slice(0,10)) rows.push({ts:x.ts,type:'EVENT',text:x.msg});
  rows.sort((a,b)=>b.ts.localeCompare(a.ts));
  decb.innerHTML = rows.slice(0,30).map(r=>`<tr><td class="small">${r.ts}</td><td><span class="badge">${r.type}</span></td><td class="reason">${r.text}</td></tr>`).join('') || '<tr><td colspan="3" class="small">尚无记录</td></tr>';
 }catch(e){console.error(e)}
}
async function forceDecide(){await fetch('/api/decide',{method:'POST'});setTimeout(refresh,3000)}
refresh(); setInterval(refresh, 30000);
</script>
</body>
</html>
